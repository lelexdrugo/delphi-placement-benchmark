# Phase-B (measured-run) effectiveness spec, time-bound variant.
#
# Each stressor runs for a fixed wall-clock DURATION. The campaigns use
# the task-bound sibling, effectiveness-taskbound.yaml.

spec_id: effectiveness
phase: B
description: |
  Compare Static-Karmada vs Heuristic-Scorer vs DELPHI-Full on a
  heterogeneous workload mix under three cluster states.

# Axis 1: seed history is provided by the Phase-A bootstrap (operator
# restores the seed dump before each baseline run; see experiments/db/).

# Axis 2: job-mix composition + temporal profile.
total_jobs: 40
random_seed: 42
namespace: delphi-experiments

distribution:
  # Weights are relative; orchestrator normalises and snaps to integers
  # via deterministic rounding given random_seed.
  - { workload_class: cpu,     intent: balanced,          weight: 25 }
  - { workload_class: cpu,     intent: cost-aware,        weight: 15 }
  - { workload_class: memory,  intent: latency-sensitive, weight: 25 }
  - { workload_class: memory,  intent: locality-aware,    weight: 10 }
  - { workload_class: network, intent: latency-sensitive, weight: 15 }
  - { workload_class: network, intent: cost-aware,        weight: 10 }

temporal_profile:
  pattern: poisson
  mean_inter_arrival_seconds: 10
  jitter_seconds: 2
  max_concurrent_jobs: 6
  # burst-only fields are ignored when pattern != burst:
  burst_size: null
  rest_seconds: null

parameters:
  cpu:
    CPU_LOAD: "2"
    DURATION: "60s"
  memory:
    MEMORY_LOAD: "256M"
    DURATION: "60s"
  network:
    MODE: "steady-download"
    BURST_SIZE: "200M"
    CHUNK_SIZE: "10M"
    DELAY_BETWEEN_CHUNKS: "2"
    DURATION: "60s"
    # Cross-cluster reachability: NodePort on on-prem. TARGET_HOST is the
    # on-prem node's public IP (the only address reachable from the
    # private edges via the Karmada-overlay path), recorded after the
    # iperf3-server deployment. If the testbed is rebuilt and the IP
    # changes, update here and in any per-run override.
    TARGET_HOST: "203.0.113.10"   # placeholder (RFC 5737): your on-prem node's address
    TARGET_PORT: "31521"

# Axis 3: cluster state (see experiments/specs/cluster-states/).
cluster_state: idle

# Resource requests/limits applied to every rendered Job. Conservative
# so foreground jobs co-exist with multi-tenant noise.
resources:
  cpu:
    requests: { cpu: "500m", memory: "128Mi" }
    limits:   { cpu: "1000m", memory: "256Mi" }
  memory:
    requests: { cpu: "200m", memory: "320Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  network:
    requests: { cpu: "200m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }
