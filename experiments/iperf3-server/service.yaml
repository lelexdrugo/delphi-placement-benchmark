# iperf3 Service: NodePort on 31521.
#
# 31521 was chosen as a port free on the on-prem cluster
# (`kubectl --context on-prem get svc -A` lists the nodePorts in use) and
# is intentionally not memorable / common to reduce future collisions.
# If a collision arises, pick another free port in the 30000-32767 range
# and update this manifest plus the experiment specs that consume it.
#
# Why NodePort and not ClusterIP: ClusterIP on on-prem is not reachable
# from member-cluster pods (public-cloud, edge-1, edge-2) without a
# Karmada multi-cluster service mesh (ServiceImport / ServiceExport)
# which is out of scope for this research artifact. NodePort + the
# on-prem node IP is the pragmatic substitute — net-stresser pods on
# member clusters connect to <ON_PREM_NODE_IP>:31521.
#
# The on-prem node IP is recorded once by the operator in the
# experiments spec parameters (TARGET_HOST). See
# experiments/iperf3-server/README.md for how to discover and record it.
apiVersion: v1
kind: Service
metadata:
  name: iperf3-server
  namespace: delphi-experiments-support
  labels:
    app.kubernetes.io/name: iperf3-server
    app.kubernetes.io/part-of: delphi-experiments
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: iperf3-server
  ports:
    - name: iperf3
      port: 5201
      targetPort: 5201
      nodePort: 31521
      protocol: TCP
